# =============================================================
# Docker Compose — Producción Veterinaria (AWS con RDS + S3)
# =============================================================
# MySQL se reemplaza por Amazon RDS (externo).
# n8n removido de producción.
# La imagen se obtiene desde GHCR.

services:

  # -----------------------------------------------------------
  # Aplicación Laravel (PHP-FPM)
  # -----------------------------------------------------------
  app:
    image: ghcr.io/serbrigue/veterinaria:main
    container_name: vet_app_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./.env:/var/www/.env
      # Compartimos la carpeta public generada en la imagen con Nginx
      - public_assets:/var/www/public
    networks:
      - vet_network

  # -----------------------------------------------------------
  # Servidor web (Nginx)
  # -----------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: vet_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      # Montar la configuración personalizada
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      # Montar el volumen que recibe la carpeta public de la app
      - public_assets:/var/www/public
    depends_on:
      - app
    networks:
      - vet_network

  # -----------------------------------------------------------
  # Caché (Redis)
  # -----------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: vet_redis_prod
    restart: unless-stopped
    volumes:
      - vet_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vet_network

  # -----------------------------------------------------------
  # Worker de colas
  # -----------------------------------------------------------
  queue:
    image: ghcr.io/serbrigue/veterinaria:main
    container_name: vet_queue_prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      APP_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    entrypoint: []
    command: >
      sh -c "sleep 15 && php artisan queue:work --verbose --tries=3 --timeout=90 --sleep=3 --max-jobs=500 --max-time=3600"
    depends_on:
      - app
      - redis
    volumes:
      - ./.env:/var/www/.env
    networks:
      - vet_network

# =============================================================
# Volúmenes
# =============================================================
volumes:
  vet_redis_data:
  # Volumen para compartir assets entre app y nginx
  public_assets:

# =============================================================
# Red
# =============================================================
networks:
  vet_network:
    driver: bridge